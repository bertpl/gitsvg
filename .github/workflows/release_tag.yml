name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate_version_trigger

  test:
    uses: ./.github/workflows/_unit_tests.yml

  publish:
    needs: [validate, test]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read       # job-level perms replace the top-level block, so re-list read for checkout
      id-token: write      # trusted publishing to PyPI + keyless provenance signing
      attestations: write  # store SLSA build provenance for the wheel + sdist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false  # don't trust a reusable cache on the release/publish path
      - run: uv build
      # SLSA build provenance over the exact artifacts we publish. Complements
      # (does not replace) the PEP 740 attestations gh-action-pypi-publish
      # emits on PyPI: this one is verifiable from the GitHub side via
      # `gh attestation verify <artifact> --repo bertpl/gitsvg`, and its bundle
      # is attached to the GitHub Release by the github-release job below.
      - name: Attest SLSA build provenance for the wheel + sdist
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # List the artifact patterns explicitly rather than `dist/*`: uv build
          # drops a `dist/.gitignore` into the output dir, which a glob would
          # otherwise sweep into the provenance as a spurious subject.
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      # Extension is `.intoto.jsonl`, not `.sigstore.jsonl`: each line is a
      # Sigstore bundle whose DSSE payload is an in-toto statement with a SLSA
      # build-provenance predicate, and OpenSSF Scorecard's Signed-Releases
      # check credits provenance purely by this filename suffix (it never opens
      # the file). Do not "correct" it back — the rename is what scores 10/10.
      - name: Stage the provenance bundle under a stable name
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}  # via env, not inline — keep it out of the run: template
        run: cp "$BUNDLE_PATH" provenance.intoto.jsonl
      - name: Hand the provenance bundle to the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance-bundle
          path: provenance.intoto.jsonl
          if-no-files-found: error
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write      # write implies the read checkout needs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false  # don't trust a reusable cache on the release/publish path
      - name: Download the provenance bundle from the publish job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance-bundle
      - name: Extract release notes from CHANGELOG.md
        run: uv run python scripts/extract_changelog.py > release_notes.md
      - name: Create GitHub Release with the provenance bundle attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            provenance.intoto.jsonl
